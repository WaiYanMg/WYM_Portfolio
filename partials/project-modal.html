<!-- 🌟 Universal Project Modal -->
<div id="project-modal" 
     class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">

  <div class="glass-panel relative w-full h-full rounded-3xl overflow-hidden text-white 
              flex flex-col md:flex-row pointer-events-auto animate-fade-in" 
       onclick="event.stopPropagation()">

    <!-- ✕ Close -->
    <button onclick="closeProjectModal()" 
      class="absolute top-4 right-4 bg-white/20 hover:bg-white/40 text-white text-2xl rounded-full px-3 py-1 transition z-50">
      ✕
    </button>

    <!-- 🧠 Left: Info -->
    <div class="flex flex-col justify-start p-8 space-y-4 md:w-[40%] overflow-y-auto max-h-[90vh]">
      <h2 id="modal-title" class="text-3xl font-bold text-gold"></h2>
      <p id="modal-desc" class="leading-relaxed"></p>

      <div class="flex flex-wrap gap-3 pt-2">
        <a id="modal-github" href="#" target="_blank"
           class="btn-gold firefly-hover relative inline-block hidden">
          GitHub
          <div class="firefly-container absolute inset-0 pointer-events-none"></div>
        </a>

        <a id="modal-demo" href="#" target="_blank"
           class="btn-gold firefly-hover relative inline-block hidden">
          View Demo
          <div class="firefly-container absolute inset-0 pointer-events-none"></div>
        </a>
      </div>
    </div>

    <!-- 🎞 Right: Media -->
    <div class="relative flex-1 flex items-center justify-center bg-black/20">
      <img id="modal-image" src="" alt="Project Screenshot" 
           class="rounded-2xl shadow-2xl max-h-[85vh] object-contain transition-opacity duration-500">
      <video id="modal-video" class="hidden rounded-2xl max-h-[85vh] w-full shadow-2xl" controls></video>

      <!-- Navigation Arrows -->
      <button onclick="prevMedia()" 
        class="absolute left-5 top-1/2 transform -translate-y-1/2 
               bg-black/60 hover:bg-black/80 text-white text-3xl font-bold 
               rounded-full px-4 py-2 shadow-xl transition">
        ‹
      </button>
      <button onclick="nextMedia()" 
        class="absolute right-5 top-1/2 transform -translate-y-1/2 
               bg-black/60 hover:bg-black/80 text-white text-3xl font-bold 
               rounded-full px-4 py-2 shadow-xl transition">
        ›
      </button>
    </div>
  </div>
</div>
