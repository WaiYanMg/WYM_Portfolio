<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Wai Yan Maung</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
   <script src="/js/tailwind-config.js"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="bg-yellowLight text-gray-900 overflow-x-hidden relative">

  <!-- 🪄 Firefly Background -->
  <div id="fireflies"></div>

  <!-- 🌟 Glass Navbar -->
  <nav class="fixed top-0 w-full bg-white/10 backdrop-blur-xl border-b border-white/20 shadow-lg z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-3">
      <a href="/index.html" class="text-2xl font-bold text-gold tracking-wide relative group firefly-hover">
        WYM
        <span class="firefly-container absolute inset-0 pointer-events-none"></span>
      </a>
      <ul class="flex space-x-8 text-gray-900 font-medium">
        <li><a href="about.html" class="hover:text-gold transition-colors relative group firefly-hover">About<span class="firefly-container absolute inset-0 pointer-events-none"></span></a></li>
        <li><a href="projects.html" class="hover:text-gold transition-colors relative group firefly-hover">Projects<span class="firefly-container absolute inset-0 pointer-events-none"></span></a></li>
        <li><a href="experience.html" class="hover:text-gold transition-colors relative group firefly-hover">Experience<span class="firefly-container absolute inset-0 pointer-events-none"></span></a></li>
        <li><a href="contact.html" class="text-gold border-b-2 border-gold pb-1 relative group firefly-hover">Contact<span class="firefly-container absolute inset-0 pointer-events-none"></span></a></li>
      </ul>
    </div>
  </nav>

  <!-- ✉️ Contact Section -->
  <section class="min-h-screen flex flex-col justify-center items-center px-6 pt-28 relative">
    <div class="glass-panel w-full max-w-lg p-8 shadow-2xl relative">
      <h2 class="text-3xl font-bold text-center text-gold mb-6">Get In Touch</h2>

      <form id="contact-form" class="space-y-4 relative z-10">
        <input type="text" name="from_name" placeholder="Full Name *" required class="w-full p-3 rounded-md border border-gray-300 focus:ring-2 focus:ring-gold outline-none">
        <input type="email" name="from_email" placeholder="Email Address *" required class="w-full p-3 rounded-md border border-gray-300 focus:ring-2 focus:ring-gold outline-none">
        <input type="text" name="company_name" placeholder="Company Name (optional)" class="w-full p-3 rounded-md border border-gray-300 focus:ring-2 focus:ring-gold outline-none">
        <input type="text" name="job_title" placeholder="Job Title (optional)" class="w-full p-3 rounded-md border border-gray-300 focus:ring-2 focus:ring-gold outline-none">
        <textarea name="message" placeholder="Your Message *" required rows="5" class="w-full p-3 rounded-md border border-gray-300 focus:ring-2 focus:ring-gold outline-none"></textarea>

        <!-- Send Button with Firefly Effect -->
        <button type="submit" class="btn-gold w-full text-lg font-semibold py-3 relative firefly-hover">
          <i class="fas fa-paper-plane mr-2"></i>Send Message
          <div class="firefly-container absolute inset-0 pointer-events-none"></div>
        </button>
        <p id="status" class="text-center text-sm mt-3"></p>
      </form>

      <p class="text-center text-gray-700 mt-6 text-sm">
        Once your message is sent, you'll receive a confirmation email automatically.
      </p>
    </div>

    <!-- Notification Panel -->
    <div id="success-popup" class="hidden fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-white/20 backdrop-blur-xl border border-white/30 text-gray-900 rounded-2xl px-8 py-5 shadow-2xl text-center z-50 transition-all duration-500">
      <h3 class="text-xl font-semibold text-gold mb-1">✅ Message Sent!</h3>
      <p class="text-sm">Thank you for reaching out — a confirmation email has been sent to you.</p>
      <div class="firefly-container absolute inset-0 pointer-events-none"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-6 bg-white/10 backdrop-blur-xl border-t border-white/20">
    <p class="text-gray-700">© 2025 Wai Yan Maung — All Rights Reserved</p>
  </footer>

  <!-- JS -->
  <script src="/js/main.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
